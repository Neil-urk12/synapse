[package]
name = "synapse"
version = "0.1.0"
edition = "2021"
authors = ["Synapse Team"]
description = "A local-first, high-performance code intelligence graph database and indexer"
license = "Apache-2.0"

[dependencies]
# CLI framework
clap = { version = "4.5", features = ["derive"] }

# Directory traversal that respects .gitignore
ignore = "0.4"

# Fast cryptographic hashing for incremental updates
sha2 = "0.10"
hex = "0.4"

# File system event watching
notify = "8.0"

# Ctrl-C signal handling
ctrlc = "3"

# Tree-sitter parsers (Prepared for Phase 3)
tree-sitter = "0.22"
tree-sitter-javascript = "0.21"
tree-sitter-typescript = "0.21"
tree-sitter-rust = "0.21"
tree-sitter-go = "0.21"
tree-sitter-python = "0.21"
tree-sitter-c = "0.21"
tree-sitter-cpp = "0.21"
tree-sitter-java = "0.21"
tree-sitter-kotlin = "0.3.8"
tree-sitter-ruby = "0.21.0"
tree-sitter-php = "0.22.8"
tree-sitter-swift = "0.5.0"

# LadybugDB connector (Prepared for Phase 2)
lbug = "0.17"

# REPL terminal reader
rustyline = "12.0"

# Fast local embedding generation (BGE-small-en-v1.5)
fastembed = "5"

# Progress bars for long-running operations
indicatif = "0.17"

# Serialization / Deserialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error enum derives for the MCP registry and other domain modules
thiserror = "2"

# Catch-all error type used at the MCP wire boundary. Lets `map_domain_error`
# downcast through `McpToolError`, `RegistryError`, and `CandidateError` in
# one chain. Internal code paths still use `thiserror`-typed enums and
# `Box<dyn Error>` — anyhow is confined to `src/mcp/errors.rs` and the mcp
# module's wire-layer error coercion.
anyhow = "1"

# Model Context Protocol server (stdio transport)
rmcp = { version = "0.8", features = ["server", "macros", "transport-io"] }

# `async fn` in dyn-safe traits. We use this on the internal `McpTool` trait
# in `src/mcp/tools.rs`; rmcp's own trait wrappers go through its macros.
async-trait = "0.1"

# Async runtime. Pulled in transitively by `rmcp`, but declared here because
# the MCP server's `mcp::run` builds its own `tokio::runtime::Runtime` and uses
# `tokio::time::timeout` for per-tool timeouts.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }

# Minimal chrono for UTC RFC3339 timestamps written to ~/.synapse/repos.json.
# `std` is required alongside `clock` because `DateTime::to_rfc3339` is gated on
# `alloc` or `std`; default features (wasmbind, oldtime, iana-time-zone) are
# unnecessary for this use case.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[lints.clippy]
# Correctness / performance: catch real bugs in the DB / index hot path.
redundant_clone = "warn"
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
cast_lossless = "deny"
# Hygiene: no stray debug prints in production code paths. `println!`
# calls scattered through business logic (status, progress, summary)
# are tracked in `docs/audits/2026-06-15-rust-best-practices-audit.md`
# Finding 12 — the planned fix is to migrate to `tracing`, but that's
# out of scope for this PR.
dbg_macro = "deny"
print_stdout = "warn"
# `expect` and `panic` in the indexer hot path can crash a long-running
# batch; we use `?` and proper error propagation instead. Test code
# (`#[cfg(test)]`) is exempt because panics there are the assertion
# mechanism. See `docs/audits/2026-06-15-rust-best-practices-audit.md`.
expect_used = "warn"
panic = "warn"

[dev-dependencies]
tempfile = "3"
